<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BitBack Product Research</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  /* Tokens copied 1:1 from mobile/lib/theme.ts so this page and the app read
     as one product rather than a bolted-on form. See that file for the
     rationale behind each value. */
  :root{
    --canvas:#0A0A0A; --sunken:#0F0E0E; --surface:#151414; --raised:#1B1A19;
    --elevated:#222120; --hairline:#272524; --border:#322F2D; --subtle:#4D4946;
    --muted:#97918B; --bright:#C9C3BC; --text:#F2F0EC;
    --primary:#F7931A; --primary-pressed:#D97C0E; --accent-soft:#2A1D08; --accent-edge:#4A3410;
    --on-primary:#1A1206;
    --success:#35A56A; --success-soft:#0F2419; --danger:#E05252; --danger-soft:#2A1313;
    --radius-control:8px; --radius-card:12px; --radius-pill:999px;
    --space-xs:4px; --space-sm:8px; --space-md:12px; --space-lg:16px; --space-xl:24px; --space-2xl:32px;
    --fs-caption:13px; --fs-body:16px; --fs-heading:20px; --fs-title:25px; --fs-display:34px;
    --min-touch:48px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--canvas);color:var(--text);}
  body{
    font-family:'Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased;
    min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center;
    padding:var(--space-lg);
  }
  .shell{width:100%; max-width:440px; margin:0 auto;}
  .wordmark{display:flex; align-items:center; gap:var(--space-sm); margin-bottom:var(--space-xl); justify-content:center;}
  .wordmark .dot{width:10px; height:10px; border-radius:50%; background:var(--primary);}
  .wordmark span{font-weight:600; letter-spacing:0.5px; font-size:var(--fs-caption); color:var(--muted); text-transform:uppercase;}

  .progress{display:flex; gap:6px; margin-bottom:var(--space-xl); padding:0 var(--space-xs);}
  .progress i{flex:1; height:4px; border-radius:var(--radius-pill); background:var(--hairline); transition:background .2s;}
  .progress i.done{background:var(--primary);}

  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-card);
    padding:var(--space-xl); min-height:340px; display:flex; flex-direction:column;
  }
  .step{display:none; flex-direction:column; flex:1; animation:fade .25s ease;}
  .step.active{display:flex;}
  @keyframes fade{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  .eyebrow{font-size:var(--fs-caption); color:var(--primary); font-weight:600; letter-spacing:0.5px; text-transform:uppercase; margin-bottom:var(--space-sm);}
  h1{font-size:var(--fs-title); line-height:1.25; margin:0 0 var(--space-sm); font-weight:600;}
  .q{font-size:var(--fs-heading); line-height:1.35; font-weight:600; margin:0 0 var(--space-lg);}
  p.sub{color:var(--muted); font-size:var(--fs-body); line-height:1.5; margin:0 0 var(--space-lg);}

  .likert{display:flex; flex-direction:column; gap:var(--space-md); flex:1;}
  .likert-row{display:flex; gap:var(--space-sm); justify-content:space-between;}
  .likert-btn{
    flex:1; aspect-ratio:1; min-height:var(--min-touch); border-radius:var(--radius-control);
    border:1px solid var(--border); background:var(--raised); color:var(--text);
    font-family:'JetBrains Mono',monospace; font-size:var(--fs-heading); font-weight:500;
    cursor:pointer; transition:all .12s;
  }
  .likert-btn:hover{border-color:var(--primary);}
  .likert-btn.selected{background:var(--primary); border-color:var(--primary); color:var(--on-primary);}
  .likert-labels{display:flex; justify-content:space-between; font-size:var(--fs-caption); color:var(--muted);}
  .kbd-hint{color:var(--subtle); font-size:var(--fs-caption); text-align:center; margin:var(--space-sm) 0 0;}
  @media (hover:none){ .kbd-hint{display:none;} }

  .choice-list{display:flex; flex-direction:column; gap:var(--space-sm); flex:1;}
  .choice{
    min-height:var(--min-touch); border-radius:var(--radius-control); border:1px solid var(--border);
    background:var(--raised); color:var(--text); font-family:'Inter'; font-size:var(--fs-body);
    text-align:left; padding:0 var(--space-lg); cursor:pointer;
  }
  .choice:hover{border-color:var(--primary);}
  .choice.selected{background:var(--accent-soft); border-color:var(--primary); color:var(--primary);}

  textarea{
    width:100%; flex:1; min-height:120px; background:var(--sunken); border:1px solid var(--border);
    border-radius:var(--radius-control); color:var(--text); font-family:'Inter'; font-size:var(--fs-body);
    padding:var(--space-md); resize:vertical;
  }
  textarea:focus, .likert-btn:focus-visible, .choice:focus-visible, .btn:focus-visible, .back-btn:focus-visible{
    outline:2px solid var(--primary); outline-offset:2px;
  }
  textarea::placeholder{color:var(--subtle);}

  .spacer{flex:1;}
  .btn{
    min-height:var(--min-touch); border-radius:var(--radius-control); border:0; font-family:'Inter';
    font-size:var(--fs-body); font-weight:600; cursor:pointer; margin-top:var(--space-lg);
  }
  .btn-primary{background:var(--primary); color:var(--on-primary);}
  .btn-primary:disabled{opacity:.4; cursor:not-allowed;}
  .btn-ghost{background:transparent; color:var(--muted); border:1px solid var(--border);}
  .btn-row{display:flex; gap:var(--space-sm);}
  .btn-row .btn{flex:1;}

  .badge{
    width:88px; height:88px; border-radius:50%; margin:0 auto var(--space-lg);
    background:conic-gradient(var(--primary) 0deg 360deg);
    display:flex; align-items:center; justify-content:center; position:relative;
  }
  .badge::before{content:""; position:absolute; inset:6px; border-radius:50%; background:var(--surface);}
  .badge span{position:relative; font-family:'JetBrains Mono'; font-weight:500; font-size:22px; color:var(--primary);}
  .center{text-align:center;}

  .error-note{
    background:var(--danger-soft); border:1px solid var(--danger); color:var(--text);
    border-radius:var(--radius-control); padding:var(--space-md); font-size:var(--fs-caption);
    margin-top:var(--space-md);
  }
  .footnote{color:var(--subtle); font-size:var(--fs-caption); text-align:center; margin-top:var(--space-lg); line-height:1.5;}

  /* Mascot + dialogue. Purely decorative commentary alongside the real
     question above it — never a restatement of it, so the instrument's
     wording (quoted in the FYP report) stays exactly as written. */
  .mascot-row{display:flex; align-items:flex-start; gap:var(--space-md); margin-bottom:var(--space-lg);}
  .mascot{width:52px; height:52px; flex-shrink:0; transition:transform .2s ease;}
  .mascot.happy{transform:rotate(-6deg);}
  .mascot.hyped{transform:rotate(-10deg) scale(1.06);}
  .mascot.thinking{transform:rotate(5deg);}
  .mascot.skeptical{transform:rotate(4deg);}
  .mascot.wink{transform:rotate(-4deg);}
  .mascot.sad{transform:rotate(3deg);}
  .bubble{
    position:relative; background:var(--raised); border:1px solid var(--border);
    border-radius:var(--radius-control); padding:var(--space-sm) var(--space-md);
    font-size:var(--fs-caption); color:var(--bright); line-height:1.4; flex:1;
  }
  .bubble::before{
    content:""; position:absolute; left:-7px; top:14px; width:12px; height:12px;
    background:var(--raised); border-left:1px solid var(--border); border-bottom:1px solid var(--border);
    transform:rotate(45deg);
  }
  .bubble.no-arrow::before{display:none;}

  .step-header{display:flex; align-items:center; gap:var(--space-sm); margin-bottom:var(--space-sm);}
  .step-header .eyebrow{margin-bottom:0;}
  .back-btn{
    width:32px; height:32px; border-radius:50%; border:1px solid var(--border); background:var(--raised);
    color:var(--muted); font-size:18px; line-height:1; cursor:pointer; display:flex; align-items:center;
    justify-content:center; flex-shrink:0; padding:0;
  }
  .back-btn:hover{border-color:var(--primary); color:var(--primary);}

  /* Optional bonus game, shown only after a successful submission. Score is
     never sent anywhere — it exists purely for a bit of fun at the end. */
  .game-prompt{border:1px dashed var(--border); border-radius:var(--radius-control); padding:var(--space-lg); margin-top:var(--space-lg);}
  .game-hud{display:flex; justify-content:space-between; font-family:'JetBrains Mono'; font-size:var(--fs-caption); color:var(--muted); margin-bottom:var(--space-sm);}
  .game-area{position:relative; height:200px; background:var(--sunken); border:1px solid var(--border); border-radius:var(--radius-control); overflow:hidden;}
  .coin-target{
    position:absolute; width:34px; height:34px; border-radius:50%; background:var(--primary);
    border:2px solid var(--primary-pressed); color:var(--on-primary); font-family:'JetBrains Mono';
    font-size:13px; display:flex; align-items:center; justify-content:center; cursor:pointer;
    animation:pop .12s ease; user-select:none;
  }
  @keyframes pop{from{transform:scale(0.3); opacity:0;} to{transform:scale(1); opacity:1;}}
</style>
</head>
<body>
<div class="shell">
  <div class="wordmark"><div class="dot"></div><span>BitBack Product Research</span></div>
  <div class="progress" id="progress"></div>
  <div class="card" id="card"><!-- steps injected by JS --></div>
  <p class="footnote">Anonymous. No account or personal data required. Takes about two minutes.</p>
</div>

<script>
/**
 * A single respondent's flow, one question per screen. Matches the
 * instrument in the FYP report's Chapter 3.6 exactly, so results from this
 * page and the in-app screen are directly comparable.
 *
 * This page is served by the FastAPI backend itself (mounted at /survey), so
 * fetch('/api/survey/responses') is same-origin: no API base to configure,
 * and it works the moment the backend is deployed and this URL is shared.
 */
const LIKERT_QUESTIONS = [
  { key: "q1", text: "I am at least somewhat interested in owning or holding Bitcoin." },
  { key: "q2", text: "I would not currently feel confident opening a cryptocurrency exchange account and buying Bitcoin myself." },
  { key: "q3", text: "Earning Bitcoin automatically as cashback, without having to buy it myself, is appealing to me." },
  { key: "q4", text: "I understood what my Bitcoin balance was worth in Singapore dollars at every point in the walkthrough." },
  { key: "q5", text: "The category-based reward rates and boosts made me want to spend more in specific categories to earn more." },
  { key: "q6", text: "Seeing a forecast of next month's earnings would make me check the app more often." },
  { key: "q7", text: "Being shown exactly which transactions were flagged as risky, and why, made me trust the app more than a plain “your card is protected” message would have." },
];
const Q8_OPTIONS = [
  { value: "much_less", label: "Much less appealing" },
  { value: "less", label: "Less appealing" },
  { value: "equally", label: "Equally appealing" },
  { value: "more", label: "More appealing" },
  { value: "much_more", label: "Much more appealing" },
];

const state = {
  screen_active_trader: null,
  q1: null, q2: null, q3: null, q4: null, q5: null, q6: null, q7: null,
  q8: null, q9: "", q10: "",
  game: "idle", // idle | playing | finished | closed — cosmetic only, never submitted
  gameScore: 0,
};

/**
 * Sat, the mascot. A flat-style illustrated coin with a swappable
 * expression — no external art assets, just inline SVG so the page stays
 * self-contained. Commentary is additional flavour text sitting beside the
 * real question, never a replacement for it: the instrument's actual
 * wording (LIKERT_QUESTIONS / Q8_OPTIONS above) never changes.
 *
 * Each expression is built from three independently-varying parts (brows,
 * eyes, mouth) plus an optional accessory, rather than a single swapped
 * mouth path — that's what makes "hyped" read as a different feeling from
 * "happy", not just the same face with a wider smile.
 */
const EXPRESSIONS = {
  neutral: {
    brows: ["M14,17 Q19,15 24,17", "M32,17 Q37,15 42,17"],
    eyes: "dot",
    mouth: "M18,35 Q28,39 38,35",
  },
  happy: {
    brows: ["M14,16 Q19,13 24,15", "M32,15 Q37,13 42,16"],
    eyes: "dot",
    mouth: "M16,33 Q28,46 40,33",
  },
  hyped: {
    brows: ["M13,14 Q19,10 25,14", "M31,14 Q37,10 43,14"],
    eyes: "wide",
    mouth: "M14,31 Q28,50 42,31 Q28,44 14,31 Z",
    accessory: "sparkle",
  },
  thinking: {
    brows: ["M14,18 Q19,15 25,18", "M31,14 Q37,17 43,15"],
    eyes: "up",
    mouth: "M23,37 Q28,35 33,37",
  },
  skeptical: {
    brows: ["M14,19 Q19,18 25,19", "M31,13 Q37,9 43,12"],
    eyes: "half",
    mouth: "M18,36 Q28,33 38,38",
  },
  wink: {
    brows: ["M14,15 Q19,12 25,15", "M32,17 Q37,15 42,17"],
    eyes: "wink",
    mouth: "M16,33 Q28,44 40,33",
  },
  sad: {
    brows: ["M14,20 Q19,24 25,21", "M31,21 Q37,24 43,20"],
    eyes: "dot",
    mouth: "M18,40 Q28,32 38,40",
  },
};
function eyesSVG(type) {
  switch (type) {
    case "wide":
      return `<circle cx="19" cy="24" r="4" fill="var(--on-primary)"/><circle cx="37" cy="24" r="4" fill="var(--on-primary)"/>`;
    case "wink":
      return `<path d="M15,24 Q19,20.5 23,24" stroke="var(--on-primary)" stroke-width="2.2" fill="none" stroke-linecap="round"/><circle cx="37" cy="24" r="3" fill="var(--on-primary)"/>`;
    case "half":
      return `<path d="M15,23 h8" stroke="var(--on-primary)" stroke-width="2.5" stroke-linecap="round"/><circle cx="37" cy="23" r="3" fill="var(--on-primary)"/>`;
    case "up":
      return `<circle cx="20" cy="22" r="2.6" fill="var(--on-primary)"/><circle cx="38" cy="22" r="2.6" fill="var(--on-primary)"/>`;
    case "dot":
    default:
      return `<circle cx="19" cy="24" r="3" fill="var(--on-primary)"/><circle cx="37" cy="24" r="3" fill="var(--on-primary)"/>`;
  }
}
function accessorySVG(name) {
  if (name === "sparkle") {
    return `<g fill="var(--on-primary)" opacity="0.9">
      <path d="M8,10 L9.4,13.2 12.6,14.6 9.4,16 8,19.2 6.6,16 3.4,14.6 6.6,13.2 Z"/>
      <path d="M47,7 L48,9.3 50.3,10.3 48,11.3 47,13.6 46,11.3 43.7,10.3 46,9.3 Z"/>
    </g>`;
  }
  return "";
}
function mascotSVG(expression) {
  const cfg = EXPRESSIONS[expression] || EXPRESSIONS.neutral;
  const mouthIsFilled = cfg.mouth.includes("Z");
  return `<svg viewBox="0 0 56 56" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    ${accessorySVG(cfg.accessory)}
    <circle cx="28" cy="28" r="25" fill="var(--primary)" stroke="var(--primary-pressed)" stroke-width="3"/>
    <path d="${cfg.brows[0]}" stroke="var(--on-primary)" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <path d="${cfg.brows[1]}" stroke="var(--on-primary)" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    ${eyesSVG(cfg.eyes)}
    <path d="${cfg.mouth}" stroke="var(--on-primary)" stroke-width="2.5" fill="${mouthIsFilled ? "var(--on-primary)" : "none"}" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}
/**
 * Commentary voice: light, tasteful Gen Z slang — the audience this
 * instrument is actually validating the product with. This is flavour text
 * only; it never touches the instrument's real question wording above.
 */
const MASCOT_LINES = {
  intro: ["hyped", "Yo, I'm Sat 🪙 — got two minutes? Let's keep this quick, no cap."],
  screen: ["thinking", "Real talk, no wrong answers here — just keep it 100 with me."],
  screenConfirm: ["skeptical", "Hold up — you're already an active trader? Just double-checking before we dip."],
  q1: ["thinking", "Be fr, not aspirational — are you actually Bitcoin-curious, or nah?"],
  q2: ["neutral", "No shade if exchanges feel like a whole maze — that's literally why this app exists."],
  q3: ["hyped", "This is basically our main character moment. How'd we do?"],
  q4: ["thinking", "Quick math check — did the SGD number actually make sense, or were you just vibing?"],
  q5: ["wink", "Boosts are designed to be a little addictive, ngl. Did it get you?"],
  q6: ["neutral", "A forecast only hits different if you'd actually open the app to check it."],
  q7: ["skeptical", "Receipts over “trust me bro” energy. Agree?"],
  q8: ["thinking", "Comparison time — don't hold back, I can take the L if it's real."],
  q9: ["thinking", "Say whatever's on your mind, I'm not out here grading grammar."],
  q10: ["hyped", "Last one — what's the one feature that'd make this a must-have?"],
};
function mascotRow(step) {
  const [expression, line] = MASCOT_LINES[step] || ["neutral", ""];
  const row = document.createElement("div");
  row.className = "mascot-row";
  row.innerHTML = `<div class="mascot ${expression}">${mascotSVG(expression)}</div><div class="bubble">${line}</div>`;
  return row;
}

// step order: intro -> screen -> 7 likert -> q8 -> q9 -> q10 -> submitting -> done
const STEPS = ["intro", "screen", ...LIKERT_QUESTIONS.map(q => q.key), "q8", "q9", "q10", "done"];
let stepIndex = 0;

const card = document.getElementById("card");
const progressEl = document.getElementById("progress");

function renderProgress() {
  // Progress excludes intro/done from the visible count so it reads 1..9.
  const total = STEPS.length - 2;
  const current = Math.max(0, Math.min(total, stepIndex - 1));
  progressEl.innerHTML = "";
  if (stepIndex === 0 || STEPS[stepIndex] === "done") { progressEl.style.visibility = "hidden"; return; }
  progressEl.style.visibility = "visible";
  for (let i = 0; i < total; i++) {
    const bar = document.createElement("i");
    if (i < current) bar.className = "done";
    progressEl.appendChild(bar);
  }
}

function goTo(index) {
  stepIndex = index;
  renderProgress();
  render();
}
function next() { goTo(stepIndex + 1); }
/** Every step so far is strictly linear (screening now branches via an
 * in-place confirmation instead of jumping the index — see renderScreen),
 * so "back" is just "one step earlier". Never called on step 0. */
function goBack() { if (stepIndex > 0) goTo(stepIndex - 1); }

/** A misclick on a Likert/choice screen used to be uncorrectable — nothing
 * let you return to fix it, which was especially bad on the screening
 * question, where a mistaken "Yes" used to submit immediately with no way
 * back. Every question screen after the intro gets this back control. */
function backButton(onBack) {
  const b = el("button", "back-btn", "‹");
  b.setAttribute("aria-label", "Go back");
  b.type = "button";
  b.onclick = onBack || goBack;
  return b;
}
function stepHeader(eyebrowText, onBack) {
  const row = el("div", "step-header");
  if (onBack || stepIndex > 0) row.appendChild(backButton(onBack));
  row.appendChild(el("div", "eyebrow", eyebrowText));
  return row;
}

/** Desktop shortcut: press 1-5 to answer whichever Likert question is on
 * screen, same as clicking the button. Ignored everywhere else (open-text
 * steps have a textarea that should own the keyboard, and other steps have
 * no numbered options to pick).
 */
document.addEventListener("keydown", (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const likertQ = LIKERT_QUESTIONS.find((q) => q.key === STEPS[stepIndex]);
  if (likertQ && /^[1-5]$/.test(e.key)) {
    state[likertQ.key] = Number(e.key);
    next();
  }
});

function render() {
  const step = STEPS[stepIndex];
  card.innerHTML = "";
  card.appendChild(
    step === "intro" ? renderIntro() :
    step === "screen" ? renderScreen() :
    step === "q8" ? renderQ8() :
    step === "q9" ? renderOpenText("q9", "What, if anything, would stop you from switching your everyday spending to a card like this?") :
    step === "q10" ? renderOpenText("q10", "What is the single feature you would want built next?") :
    step === "done" ? renderDone() :
    renderLikert(LIKERT_QUESTIONS.find(q => q.key === step))
  );
}

function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}

function renderIntro() {
  const wrap = el("div", "step active");
  wrap.appendChild(stepHeader("Final Year Project — NTU CCDS"));
  wrap.appendChild(mascotRow("intro"));
  wrap.appendChild(el("h1", "", "Help validate BitBack"));
  wrap.appendChild(el("p", "sub",
    "BitBack turns everyday card spending into fractional Bitcoin cashback. This short, anonymous survey checks whether the idea " +
    "actually lands with people like you — it takes about two minutes and there's no account or personal data involved."));
  wrap.appendChild(el("div", "spacer"));
  const btn = el("button", "btn btn-primary", "Start");
  btn.onclick = next;
  wrap.appendChild(btn);
  return wrap;
}

function renderScreen() {
  const wrap = el("div", "step active");
  // Active traders are out of scope (Chapter 3.1). A tap on "Yes" used to
  // submit immediately with no way back — the single riskiest misclick on
  // the whole page, since it's irreversible. Now it opens an inline
  // confirmation instead of finishing outright.
  if (state._confirmingScreenOut) {
    wrap.appendChild(stepHeader("Just checking", () => {
      state._confirmingScreenOut = false;
      state.screen_active_trader = null;
      render();
    }));
    wrap.appendChild(mascotRow("screenConfirm"));
    wrap.appendChild(el("p", "q", "Got it — you actively trade crypto, so the survey ends here for you. Sure that's right?"));
    const list = el("div", "choice-list");
    const yes = el("button", "choice", "Yes, that's right");
    const no = el("button", "choice", "No, let me change that");
    yes.onclick = () => finish();
    no.onclick = () => { state._confirmingScreenOut = false; state.screen_active_trader = null; render(); };
    list.appendChild(yes);
    list.appendChild(no);
    wrap.appendChild(list);
    wrap.appendChild(el("div", "spacer"));
    return wrap;
  }
  wrap.appendChild(stepHeader("First, a quick check"));
  wrap.appendChild(mascotRow("screen"));
  wrap.appendChild(el("p", "q", "Do you currently trade cryptocurrency actively or regularly — for example, buying or selling on an exchange at least monthly?"));
  const list = el("div", "choice-list");
  [["No", false], ["Yes", true]].forEach(([label, value]) => {
    const b = el("button", "choice", label);
    b.onclick = () => {
      state.screen_active_trader = value;
      if (value) { state._confirmingScreenOut = true; render(); } else { next(); }
    };
    list.appendChild(b);
  });
  wrap.appendChild(list);
  wrap.appendChild(el("div", "spacer"));
  return wrap;
}

function renderLikert(q) {
  const wrap = el("div", "step active");
  wrap.appendChild(stepHeader(`Question ${LIKERT_QUESTIONS.indexOf(q) + 1} of 7`));
  wrap.appendChild(mascotRow(q.key));
  wrap.appendChild(el("p", "q", q.text));
  const likert = el("div", "likert");
  const row = el("div", "likert-row");
  for (let v = 1; v <= 5; v++) {
    const b = el("button", "likert-btn" + (state[q.key] === v ? " selected" : ""), String(v));
    b.onclick = () => { state[q.key] = v; next(); };
    row.appendChild(b);
  }
  likert.appendChild(row);
  const labels = el("div", "likert-labels");
  labels.appendChild(el("span", "", "Strongly disagree"));
  labels.appendChild(el("span", "", "Strongly agree"));
  likert.appendChild(labels);
  wrap.appendChild(likert);
  wrap.appendChild(el("p", "kbd-hint", "Tip: press 1–5 on your keyboard"));
  wrap.appendChild(el("div", "spacer"));
  return wrap;
}

function renderQ8() {
  const wrap = el("div", "step active");
  wrap.appendChild(stepHeader("Question 8 of 10"));
  wrap.appendChild(mascotRow("q8"));
  wrap.appendChild(el("p", "q", "Compared to a points-based cashback card you already have, this app's Bitcoin reward is…"));
  const list = el("div", "choice-list");
  Q8_OPTIONS.forEach(opt => {
    const b = el("button", "choice" + (state.q8 === opt.value ? " selected" : ""), opt.label);
    b.onclick = () => { state.q8 = opt.value; next(); };
    list.appendChild(b);
  });
  wrap.appendChild(list);
  wrap.appendChild(el("div", "spacer"));
  return wrap;
}

function renderOpenText(key, question) {
  const wrap = el("div", "step active");
  const n = key === "q9" ? 9 : 10;
  wrap.appendChild(stepHeader(`Question ${n} of 10 · optional`));
  wrap.appendChild(mascotRow(key));
  wrap.appendChild(el("p", "q", question));
  const ta = document.createElement("textarea");
  ta.placeholder = "Type as much or as little as you like…";
  ta.value = state[key];
  ta.oninput = () => { state[key] = ta.value; };
  wrap.appendChild(ta);
  const btn = el("button", "btn btn-primary", n === 9 ? "Next" : "Submit");
  btn.onclick = () => { if (n === 10) { submit(); } else { next(); } };
  wrap.appendChild(btn);
  return wrap;
}

function renderDone() {
  const wrap = el("div", "step active center");
  const badge = el("div", "badge", "<span>₿</span>");
  wrap.appendChild(badge);
  if (state._status === "submitting") {
    wrap.appendChild(el("h1", "", "Sending…"));
    wrap.appendChild(el("p", "sub", "One moment."));
  } else if (state._status === "error") {
    wrap.appendChild(mascotRowCentered("sad", "Ugh, that flopped — your answers are still safe right here though."));
    wrap.appendChild(el("h1", "", "Almost there"));
    wrap.appendChild(el("p", "sub", "Your answers are saved on this page — the submission just didn't go through."));
    wrap.appendChild(el("div", "error-note", state._error));
    const row = el("div", "btn-row");
    const retry = el("button", "btn btn-primary", "Retry");
    const edit = el("button", "btn btn-ghost", "Edit my answers");
    retry.onclick = submit;
    // A network failure shouldn't strand you on a dead-end screen with only
    // "try the exact same thing again" — this reopens the last question so
    // you can actually change something before resubmitting.
    edit.onclick = () => { state._status = null; state._error = null; goTo(STEPS.length - 2); };
    row.appendChild(retry);
    row.appendChild(edit);
    wrap.appendChild(row);
  } else if (state.screen_active_trader) {
    wrap.appendChild(mascotRowCentered("neutral", "Ah, you're already deep in the crypto game — this one's for the curious-but-cautious crowd. Appreciate the click though."));
    wrap.appendChild(el("h1", "", "Thanks for stopping by"));
    wrap.appendChild(el("p", "sub", "This particular study is aimed at people who are curious about Bitcoin but not yet active traders, so we'll leave it there."));
  } else {
    wrap.appendChild(mascotRowCentered("hyped", "Say less — that's real data now, and you just helped build this. Thank you!"));
    wrap.appendChild(el("h1", "", "Recorded — thank you"));
    wrap.appendChild(el("p", "sub", "Your response just became part of a real Final Year Project evaluation. No account, no email, no tracking — that's it."));
    wrap.appendChild(renderGameSection());
  }
  return wrap;
}

/** Same mascot, laid out centered under the badge instead of beside a
 * question — used only on the completion screen. */
function mascotRowCentered(expression, line) {
  const row = document.createElement("div");
  row.style.cssText = "display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:16px;";
  row.innerHTML = `<div class="mascot ${expression}" style="width:44px;height:44px;">${mascotSVG(expression)}</div>
    <div class="bubble no-arrow" style="max-width:320px;">${line}</div>`;
  return row;
}

/** The optional bonus game. Purely cosmetic — its score is never read by
 * anything that submits data, so it cannot bias or gate the real survey. */
function renderGameSection() {
  const box = el("div", "game-prompt");
  if (state.game === "idle") {
    box.appendChild(el("p", "sub", "Want a 10-second bonus game before you go? Totally optional — it doesn't affect your answers."));
    const row = el("div", "btn-row");
    const play = el("button", "btn btn-primary", "Play");
    const skip = el("button", "btn btn-ghost", "No thanks");
    play.onclick = () => { state.game = "playing"; render(); requestAnimationFrame(() => startGameLoop(document.getElementById("game-area"))); };
    skip.onclick = () => { state.game = "closed"; render(); };
    row.appendChild(play); row.appendChild(skip);
    box.style.marginTop = "16px";
    box.appendChild(row);
  } else if (state.game === "playing") {
    box.style.border = "none"; box.style.padding = "0"; box.style.marginTop = "16px";
    const hud = el("div", "game-hud");
    hud.innerHTML = `<span>Catch the sats</span><span><span id="game-score">0</span> caught · <span id="game-time">10</span>s</span>`;
    const area = el("div", "game-area");
    area.id = "game-area";
    box.appendChild(hud);
    box.appendChild(area);
  } else if (state.game === "finished") {
    const tier = state.gameScore >= 8 ? "Show-off." : state.gameScore >= 4 ? "Solid reflexes." : "Rusty — but hey, you tried.";
    box.appendChild(el("p", "sub", `You caught ${state.gameScore} sat${state.gameScore === 1 ? "" : "s"}. ${tier}`));
    const row = el("div", "btn-row");
    const again = el("button", "btn btn-primary", "Play again");
    const done = el("button", "btn btn-ghost", "I'm done");
    again.onclick = () => { state.game = "idle"; render(); };
    done.onclick = () => { state.game = "closed"; render(); };
    row.appendChild(again); row.appendChild(done);
    box.style.marginTop = "16px";
    box.appendChild(row);
  } else {
    return el("div"); // "closed" — nothing more to show
  }
  return box;
}

function startGameLoop(area) {
  if (!area) return;
  let score = 0;
  let timeLeft = 10;
  const scoreEl = document.getElementById("game-score");
  const timeEl = document.getElementById("game-time");

  const spawn = () => {
    const size = 34;
    const maxX = Math.max(0, area.clientWidth - size);
    const maxY = Math.max(0, area.clientHeight - size);
    const coin = el("div", "coin-target", "₿");
    coin.style.left = Math.round(Math.random() * maxX) + "px";
    coin.style.top = Math.round(Math.random() * maxY) + "px";
    const missTimer = setTimeout(() => coin.remove(), 850);
    coin.onclick = () => {
      clearTimeout(missTimer);
      coin.remove();
      score += 1;
      if (scoreEl) scoreEl.textContent = String(score);
    };
    area.appendChild(coin);
  };

  const spawnTimer = setInterval(spawn, 650);
  const clock = setInterval(() => {
    timeLeft -= 1;
    if (timeEl) timeEl.textContent = String(Math.max(0, timeLeft));
    if (timeLeft <= 0) {
      clearInterval(spawnTimer);
      clearInterval(clock);
      area.innerHTML = "";
      state.game = "finished";
      state.gameScore = score;
      render();
    }
  }, 1000);
}

async function submit() {
  state._status = "submitting";
  state._error = null;
  goTo(STEPS.length - 1); // "done" step, shows a submitting state via the badge
  try {
    const payload = {
      source: "web",
      screen_active_trader: state.screen_active_trader,
      q1: state.q1, q2: state.q2, q3: state.q3, q4: state.q4,
      q5: state.q5, q6: state.q6, q7: state.q7, q8: state.q8,
      q9: state.q9 || null, q10: state.q10 || null,
    };
    const res = await fetch("/api/survey/responses", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.detail || `Server responded ${res.status}`);
    }
    state._status = "success";
  } catch (e) {
    state._status = "error";
    state._error = e.message || "Couldn't reach the server. Check your connection and try again.";
  }
  render();
}

function finish() { submit(); }

render();
renderProgress();
</script>
