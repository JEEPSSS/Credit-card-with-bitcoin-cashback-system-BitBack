name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: ruff check app main.py seed_demo.py tests evaluation scripts migrations/env.py

      - name: Tests
        run: pytest

      - name: Migrations apply to an empty database
        run: alembic upgrade head
        env:
          DATABASE_URL: sqlite:///./ci.db

  postgres:
    # Production runs on Postgres (Neon). SQLite accepts things Postgres
    # rejects or returns differently - this job exists because analytics/recap
    # passed every SQLite test and returned 500 on the deployed database.
    name: Backend on Postgres (migrations + tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bitback
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bitback
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Migrations apply to an empty Postgres database
        run: alembic upgrade head

      - name: Models and migrations agree
        run: alembic check

      - name: Tests
        run: pytest
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bitback

  mobile:
    name: Mobile (typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Bundle
        run: npx expo export --platform android --output-dir /tmp/expo-export
